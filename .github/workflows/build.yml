# Builds cubebrowser.dol on GitHub's servers - nothing to install locally.
# Uses libogc2, which supports the official BBA and WIZnet adapters (ETH2GC).
name: Build CubeBrowser

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: browser-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Get the source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache the pinned emulator image
        id: emulator-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/cube-emulator.tar
          key: cube-emulator-amd64-${{ hashFiles('tests/runtime/Dockerfile', 'tests/runtime/dolphin/*.patch') }}

      - name: Prepare the emulator
        run: |
          if [ -f /tmp/cube-emulator.tar ]; then
            docker load -i /tmp/cube-emulator.tar
          else
            docker build -t cube-runtime tests/runtime
            docker save cube-runtime -o /tmp/cube-emulator.tar
          fi

      - name: Test the console lab's request parser
        # ui_lab.c and its test are Indigo's, copied unchanged.
        run: |
          gcc -std=gnu11 -Wall -Wextra -Werror -fsanitize=address,undefined -no-pie \
            -Isource tools/lab/test_ui_lab.c source/ui_lab.c -o "$RUNNER_TEMP/test_ui_lab"
          "$RUNNER_TEMP/test_ui_lab"

      - name: Check saved HTML and CSS regressions
        run: sh tools/fuzz/run.sh --regressions

      - name: Check browser engine behavior
        run: sh tools/tests/run.sh

      - name: Download mbedTLS
        run: sh get-mbedtls.sh

      - name: Build the .dol
        run: docker run --rm -v "$PWD:/src" -w /src ghcr.io/extremscorner/libogc2@sha256:f9ffb7e33c4ba4010da8e40c01366f7c24732130146abd99690403bd42d3e4c2 make

      - name: Prove the bundled browser has the tested bytes
        run: |
          mkdir -p "$RUNNER_TEMP/browser-bundle"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/browser-bundle"
          cp -R third_party "$RUNNER_TEMP/browser-bundle/"
          docker run --rm -e LC_ALL=C.UTF-8 -v "$RUNNER_TEMP/browser-bundle:/work/browser-src" -w /work/browser-src \
            ghcr.io/extremscorner/libogc2@sha256:f9ffb7e33c4ba4010da8e40c01366f7c24732130146abd99690403bd42d3e4c2 make -j8
          cmp cubebrowser.dol "$RUNNER_TEMP/browser-bundle/cubebrowser.dol"

      - name: Boot and use this candidate
        run: |
          docker network create --internal --subnet 192.0.2.0/24 cube-runtime
          trap 'docker network rm cube-runtime' EXIT
          docker run --rm --network cube-runtime --ip 192.0.2.3 --cpus 2 --memory 3g \
            -v "$PWD:/work" cube-runtime \
            python3 tests/runtime/run.py --dol cubebrowser.dol --card-files sd/gcbrowser --out runtime-evidence
          docker run --rm --network cube-runtime --ip 192.0.2.3 --cpus 2 --memory 3g \
            -v "$PWD:/work" cube-runtime \
            python3 tests/runtime/run.py --dol cubebrowser.dol --card-files sd/gcbrowser \
              --out runtime-evidence/wide-pal-port4 --wide --pal --pad-port 4

      - name: Prove ZIP persistence across browser restarts
        run: |
          mkdir -p "$RUNNER_TEMP/zip-cert"
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 2 \
            -config tests/runtime/zip-cert.cnf -keyout "$RUNNER_TEMP/zip-cert/key.pem" \
            -out "$RUNNER_TEMP/zip-cert/cert.pem"
          docker network create --internal --subnet 192.0.2.0/24 cube-zip
          trap 'docker network rm cube-zip' EXIT
          docker run --rm --network cube-zip --ip 192.0.2.3 --cpus 2 --memory 3g \
            -v "$PWD:/work" -v "$RUNNER_TEMP/zip-cert:/cert:ro" cube-runtime \
            python3 tests/runtime/run_zip.py --dol cubebrowser.dol --card-files sd/gcbrowser \
              --cert-dir /cert --out runtime-evidence/zip-restarts

      - name: Build the pinned Indigo launcher
        env:
          INDIGO_REF: 3d9512b2ec9e8a84e57a65670ebb294585b7c4d0
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/spencernorton/indigo.git "$RUNNER_TEMP/indigo"
          git -C "$RUNNER_TEMP/indigo" checkout --detach "$INDIGO_REF"
          docker run --rm -u "$(id -u):$(id -g)" -e LC_ALL=C.UTF-8 \
            -v "$RUNNER_TEMP/indigo:/indigo" -w /indigo \
            ghcr.io/extremscorner/libogc2@sha256:f9ffb7e33c4ba4010da8e40c01366f7c24732130146abd99690403bd42d3e4c2 make -j8 dev
          # This source/toolchain/locale tuple must reproduce the green beta package.
          printf '%s  %s\n' 45b371fe823e315b15ba84f1f406ebc8b94d2b48ff56df0d5bdca1fcbbe5ea4c \
            "$RUNNER_TEMP/indigo/cube/swiss/swiss.dol" | sha256sum -c -
          mkdir -p runtime-evidence/indigo-return
          python3 "$RUNNER_TEMP/indigo/buildtools/ci/verify_dol.py" "$RUNNER_TEMP/indigo/cube/swiss/swiss.dol" \
            --revision "$INDIGO_REF" --short "$(printf '%s' "$INDIGO_REF" | cut -c1-7)" \
            --toolchain ghcr.io/extremscorner/libogc2@sha256:f9ffb7e33c4ba4010da8e40c01366f7c24732130146abd99690403bd42d3e4c2 \
            --out runtime-evidence/indigo-return/indigo-provenance.json

      - name: Prove Indigo launches and reloads through both return controls
        run: |
          docker network create --internal --subnet 192.0.2.0/24 cube-indigo
          trap 'docker network rm cube-indigo' EXIT
          docker run --rm --network cube-indigo --ip 192.0.2.3 --cpus 2 --memory 3g \
            -v "$PWD:/work" -v "$RUNNER_TEMP/indigo:/indigo:ro" cube-runtime \
            python3 tests/runtime/run_indigo.py --dol cubebrowser.dol --card-files sd/gcbrowser \
              --indigo-src /indigo --indigo-dol /indigo/cube/swiss/swiss.dol \
              --indigo-provenance runtime-evidence/indigo-return/indigo-provenance.json --out runtime-evidence/indigo-return
          docker run --rm --network cube-indigo --ip 192.0.2.3 --cpus 2 --memory 3g \
            -v "$PWD:/work" -v "$RUNNER_TEMP/indigo:/indigo:ro" cube-runtime \
            python3 tests/runtime/run_indigo.py --dol cubebrowser.dol --card-files sd/gcbrowser \
              --indigo-src /indigo --indigo-dol /indigo/cube/swiss/swiss.dol \
              --indigo-provenance runtime-evidence/indigo-return/indigo-provenance.json \
              --out runtime-evidence/indigo-return-motion-off --no-motion

      - name: Runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-runtime-evidence
          path: runtime-evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Gather files for the SD card
        run: |
          mkdir -p package
          cp cubebrowser.dol package/
          cp -r sd/gcbrowser package/

      - name: Upload result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cubebrowser
          path: package/
